name: iOS CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -m 5 "iPhone"

      - name: Resolve simulator destination
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+(\s\([A-Za-z]+\))?" | head -1 | xargs)
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild -project Nocturne.xcodeproj \
            -scheme Nocturne \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild -project Nocturne.xcodeproj \
            -scheme Nocturne \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            test | xcbeautify

      - name: Build (Release, check deployment target)
        run: |
          set -o pipefail
          xcodebuild -project Nocturne.xcodeproj \
            -scheme Nocturne \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  build-ipa:
    name: Unsigned IPA (sideload-ready)
    runs-on: macos-15
    needs: build-test
    # Собирается вручную или на теге (v*), чтобы не тратить минуты на каждый пуш.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Nocturne.xcodeproj \
            -scheme Nocturne \
            -destination "generic/platform=iOS" \
            -archivePath build/Nocturne.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | xcbeautify

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/Nocturne.xcarchive/Products/Applications/Nocturne.app" build/Payload/
          cd build
          zip -qry Nocturne-unsigned.ipa Payload
          ls -lh Nocturne-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-unsigned-ipa
          path: build/Nocturne-unsigned.ipa
          retention-days: 30
