name: Nocturne
options:
  bundleIdPrefix: app.nocturne
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Nocturne:
    type: application
    platform: iOS
    sources:
      - path: Nocturne
      - path: Shared
    dependencies:
      - target: NocturneWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nocturne.music
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Nocturne/Nocturne.entitlements
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Nocturne/Info.plist
      properties:
        CFBundleDisplayName: Nocturne
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        NSAppleMusicUsageDescription: "Доступ к медиатеке нужен, чтобы показать вашу музыку и играть локальные файлы."
        NSMicrophoneUsageDescription: "Микрофон нужен, чтобы записать 10 секунд музыки рядом и распознать трек (ShazamKit)."
        NSUserNotificationsUsageDescription: "Уведомления о новых треках в вашей волне."
        ITSAppUsesNonExemptEncryption: false

  NocturneWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "16.1"
    sources:
      - path: NocturneWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nocturne.music.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: NocturneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nocturne
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  NocturneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Nocturne
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nocturne.music.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nocturne:
    build:
      targets:
        Nocturne: all
        NocturneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NocturneTests
